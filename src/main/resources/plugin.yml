name: PlayerReputation
version: 1.4.0
main: com.lei.reputation.PlayerReputation # Your main class path
api-version: '1.21'
author: LeiConrad
description: Tracks player kills and applies LuckPerms prefixes for reputation. Hides base names.
# Add LuckPerms as a dependency
depend: [LuckPerms] # Your plugin will not enable without LuckPerms
load: POSTWORLD
commands:
  rep:
    description: PlayerReputation commands.
    usage: /rep <reload|check [player]|setkills <player> <amount>>
    permission: playerreputation.admin
permissions:
  playerreputation.admin:
    description: Allows usage of admin commands for PlayerReputation.
    default: op